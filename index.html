<!DOCTYPE html>
<html class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Papa Martin</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .menu-container {
            max-width: 450px;
            width: 100%;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #ff9800;
            margin-top: 5px;
            margin-bottom: 20px;
            font-size: 26px;
        }
        .menu-item {
            background: #2a2a2a;
            margin-bottom: 20px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .item-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #3b3b3b;
            border-bottom: 2px solid #ff9800;
        }
        .item-details {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .item-title {
            font-weight: bold;
            font-size: 19px;
            color: #fff;
            margin: 0;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }
        .item-price {
            color: #ffb74d;
            font-size: 18px;
            font-weight: 700;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .btn-qty {
            background: #ff9800;
            color: #000;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty {
            font-size: 18px;
            font-weight: bold;
            min-width: 24px;
            text-align: center;
            color: #fff;
        }
        .form-section {
            margin: 25px 0 15px 0;
            border-top: 1px dashed #444;
            padding-top: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #b3b3b3;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .info-box {
            background: #2a2a2a;
            padding: 14px;
            border-radius: 10px;
            border-left: 4px solid #ff9800;
            margin-bottom: 20px;
            font-size: 13px;
            color: #ccc;
            line-height: 1.4;
        }
        .account-num {
            background: #121212;
            padding: 4px 8px;
            display: inline-block;
            border-radius: 4px;
            margin-bottom: 8px;
            color: #ff9800;
            font-family: monospace;
            font-weight: bold;
        }
        .total-box {
            text-align: right;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffb74d;
            border-bottom: 1px solid #444;
            padding-bottom: 12px;
        }
        .btn-whatsapp {
            background: #00e676;
            color: #000;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="menu-container">
    <h2>Le Papa Martin</h2>
    
    <div id="menu-items">
        <!-- Блюдо 1 -->
        <div class="menu-item">
            <img class="item-img" src="https://unsplash.com">
            <div class="item-details">
                <div class="item-title">Искандер Кебаб</div>
                <div class="item-row">
                    <div class="item-price">440 сом</div>
                    <div class="controls">
                        <button class="btn-qty" onclick="modifyItem('kebab',-1)">-</button>
                        <span class="qty" id="qty-kebab">0</span>
                        <button class="btn-qty" onclick="modifyItem('kebab',1)">+</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Блюдо 2 -->
        <div class="menu-item">
            <img class="item-img" src="https://unsplash.com">
            <div class="item-details">
                <div class="item-title">Фирменный РD</div>
                <div class="item-row">
                    <div class="item-price">350 сом</div>
                    <div class="controls">
                        <button class="btn-qty" onclick="modifyItem('burger',-1)">-</button>
                        <span class="qty" id="qty-burger">0</span>
                        <button class="btn-qty" onclick="modifyItem('burger',1)">+</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Блюдо 3 -->
        <div class="menu-item">
            <img class="item-img" src="https://unsplash.com">
            <div class="item-details">
                <div class="item-title">Шаурма по-турецки</div>
                <div class="item-row">
                    <div class="item-price">350 сом</div>
                    <div class="controls">
                        <button class="btn-qty" onclick="modifyItem('shawa',-1)">-</button>
                        <span class="qty" id="qty-shawa">0</span>
                        <button class="btn-qty" onclick="modifyItem('shawa',1)">+</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Блюдо 4 -->
        <div class="menu-item">
            <img class="item-img" src="https://unsplash.com">
            <div class="item-details">
                <div class="item-title">Настоящий Донер</div>
                <div class="item-row">
                    <div class="item-price">350 сом</div>
                    <div class="controls">
                        <button class="btn-qty" onclick="modifyItem('doner',-1)">-</button>
                        <span class="qty" id="qty-doner">0</span>
                        <button class="btn-qty" onclick="modifyItem('doner',1)">+</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="form-section">
        <div class="form-group">
            <label>Ваше имя:</label>
            <input type="text" id="client-name" placeholder="Введите имя">
        </div>
        <div class="form-group">
            <label>Способ получения:</label>
            <select id="delivery-type" onchange="runCalc()">
                <option value="pickup">Самовывоз (Бесплатно)</option>
                <option value="delivery">Доставка (150 сом / От 1500 бесплатно)</option>
            </select>
        </div>
        <div class="form-group" id="address-block" style="display: none;">
            <label>Адрес доставки:</label>
            <input type="text" id="client-address" placeholder="Улица, дом, квартира">
        </div>
    </div>

    <div class="info-box">
        <div class="account-num">500043714</div>
        <div class="requisites">
            <p><strong>📌 Реквизиты для оплаты:</strong></p>
            <p>Кошелек администратора: +996 773 881 764 (MBank, О!Деньги)</p>
        </div>
    </div>

    <div class="total-box">
        Итого к оплате: <span id="total-price">0</span> сом
    </div>

    <a id="whatsapp-link" class="btn-whatsapp" href="#" onclick="sendOrder(event)">Оформить и отправить в WhatsApp</a>
</div>

<script>
    const adminPhone = "996773881764";
    const basket = { kebab: 0, burger: 0, shawa: 0, doner: 0 };
    const cost = { kebab: 440, burger: 350, shawa: 350, doner: 350 };
    const title = { kebab: "Искандер Кебаб", burger: "Фирменный РD", shawa: "Шаурма по-турецки", doner: "Настоящий Донер" };

    function modifyItem(id, change) {
        basket[id] += change;
        if (basket[id] < 0) basket[id] = 0;
        document.getElementById("qty-" + id).innerText = basket[id];
        runCalc();
    }

    function runCalc() {
        let totalItems = 0;
        Object.keys(basket).forEach(id => { totalItems += basket[id] * cost[id]; });
        
        const type = document.getElementById("delivery-type").value;
        document.getElementById("address-block").style.display = (type === "delivery") ? "block" : "none";
        
        let fee = 0;
        if (type === "delivery" && totalItems > 0) {
            fee = (totalItems >= 1500) ? 0 : 150;
        }
        
        document.getElementById("total-price").innerText = totalItems + fee;
