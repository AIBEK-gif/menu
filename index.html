<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Papa Martin</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .menu-container {
            max-width: 450px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #ff9800;
            margin-top: 0;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        .item-info .name {
            font-weight: bold;
            font-size: 16px;
        }
        .item-info .price {
            color: #ffb74d;
            font-size: 14px;
            margin-top: 4px;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-qty {
            background: #ff9800;
            color: #000;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .qty {
            font-size: 16px;
            min-width: 20px;
            text-align: center;
        }
        .delivery-section {
            margin: 20px 0;
        }
        .delivery-section select {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 15px;
        }
        .info-box {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff9800;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .account-num, .account-code {
            background: #121212;
            padding: 5px 10px;
            display: inline-block;
            border-radius: 4px;
            font-family: monospace;
            margin-bottom: 5px;
        }
        .requisites ul {
            padding-left: 20px;
            margin: 5px 0 0 0;
        }
        .total-box {
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffb74d;
        }
        .btn-whatsapp {
            background: #00e676;
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
        .btn-whatsapp:hover {
            background: #00c853;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="menu-container">
    <h2>🍔 Le Papa Martin 🌯</h2>
    <div id="menu-items"></div>

    <div class="delivery-section">
        <label style="display:block; margin-bottom:5px;">Способ получения:</label>
        <select id="delivery-type" onchange="calculateTotal()">
            <option value="pickup">Самовывоз (Бесплатно)</option>
            <option value="delivery">Доставка</option>
        </select>
    </div>

    <div class="info-box">
        <div class="account-num">500043714</div>
        <div class="account-code">526</div>
        <div class="requisites">
            <p><strong>📌 Реквизиты для выставления счета:</strong></p>
            <ul>
                <li>Официальный кошелек администратора: +996 773 881 764</li>
                <li>Доступные банки: MBank, О!Деньги, Элсом</li>
                <li>Статус: Счет сформируется автоматически при получении заявки</li>
            </ul>
        </div>
    </div>

    <div class="total-box">
        Итого к оплате: <span id="total-price">0</span> сом
    </div>

    <!-- Заменили элемент button на прямую ссылку для обхода блокировок Safari -->
    <a id="whatsapp-link" class="btn-whatsapp" href="#" onclick="sendOrder(event)">Оформить и отправить в WhatsApp</a>
</div>

<script>
    const adminPhoneNumber = "996773881764";

    const menu = {
        "1": { name: "Искандер Кебаб", price: 440, qty: 0 },
        "2": { name: "Фирменный РD", price: 350, qty: 0 },
        "3": { name: "Шаурма по-турецки", price: 350, qty: 0 },
        "4": { name: "Настоящий Донер", price: 350, qty: 0 }
    };

    function renderMenu() {
        const container = document.getElementById('menu-items');
        container.innerHTML = '';
        
        Object.keys(menu).forEach(id => {
            const item = menu[id];
            const itemDiv = document.createElement('div');
            itemDiv.className = 'menu-item';
            itemDiv.innerHTML = `
                <div class="item-info">
                    <div class="name">${item.name}</div>
                    <div class="price">${item.price} сом</div>
                </div>
                <div class="controls">
                    <button class="btn-qty" onclick="modifyQty('${id}', -1)">-</button>
                    <span class="qty" id="qty-${id}">${item.qty}</span>
                    <button class="btn-qty" onclick="modifyQty('${id}', 1)">+</button>
                </div>
            `;
            container.appendChild(itemDiv);
        });
    }

    function modifyQty(id, change) {
        if (menu[id]) {
            menu[id].qty += change;
            if (menu[id].qty < 0) menu[id].qty = 0;
            document.getElementById(`qty-${id}`).innerText = menu[id].qty;
            calculateTotal();
        }
    }

    function calculateTotal() {
        let itemsTotal = 0;
        Object.keys(menu).forEach(id => {
            itemsTotal += menu[id].qty * menu[id].price;
        });

        const deliveryType = document.getElementById('delivery-type').value;
        let deliveryFee = 0;

        if (deliveryType === 'delivery' && itemsTotal > 0) {
            deliveryFee = itemsTotal >= 1500 ? 0 : 150;
        }

        const finalTotal = itemsTotal + deliveryFee;
        document.getElementById('total-price').innerText = finalTotal;
        return { itemsTotal, deliveryFee, finalTotal };
    }

    function sendOrder(event) {
        const { itemsTotal, deliveryFee, finalTotal } = calculateTotal();
        const deliveryType = document.getElementById('delivery-type').value;

        if (itemsTotal === 0) {
            event.preventDefault();
            alert('Пожалуйста, выберите хотя бы одно блюдо!');
            return;
        }

        let message = "*Новый заказ в Le Papa Martin*\n\n";
        Object.keys(menu).forEach(id => {
            const item = menu[id];
            if (item.qty > 0) {
                message += "▪️ " + item.name + " x" + item.qty + " (" + (item.qty * item.price) + " сом)\n";
            }
        });

        message += "\n*Способ получения:* " + (deliveryType === 'delivery' ? 'Доставка' : 'Самовывоз');
        if (deliveryType === 'delivery') {
            message += "\n*Доставка:* " + (deliveryFee === 0 ? 'Бесплатно (от 1500 сом)' : deliveryFee + ' сом');
        }
        
        message += "\n*ИТОГО К ОПЛАТЕ:* " + finalTotal + " сом\n\n";
        message += "Пожалуйста, подтвердите заказ и вышлите реквизиты.";

        const encodedMessage = encodeURIComponent(message);
        const whatsappUrl = "whatsapp://send?phone=" + adminPhoneNumber + "&text=" + encodedMessage;
;
        
        // Меняем ссылку ссылки прямо перед переходом — бронебойный метод для Safari на iPhone
        const linkElement = document.getElementById('whatsapp-link');
        linkElement.href = whatsappUrl;
        linkElement.target = '_blank';
    }

    renderMenu();
</script>

</body>
</html>
