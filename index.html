<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Papa Martin</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .menu-container {
            max-width: 450px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #ff9800;
            margin-top: 0;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 12px;
        }
        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .item-img {
            width: 65px;
            height: 65px;
            border-radius: 10px;
            object-fit: cover;
            background-color: #3b3b3b;
        }
        .item-info .name {
            font-weight: bold;
            font-size: 16px;
        }
        .item-info .price {
            color: #ffb74d;
            font-size: 14px;
            margin-top: 4px;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-qty {
            background: #ff9800;
            color: #000;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .form-section {
            margin: 20px 0;
            border-top: 1px dashed #444;
            padding-top: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #b3b3b3;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .info-box {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #ff9800;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .account-num {
            background: #121212;
            padding: 4px 8px;
            display: inline-block;
            border-radius: 4px;
            margin-bottom: 5px;
            color: #ff9800;
        }
        .total-box {
            text-align: right;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffb74d;
        }
        .btn-whatsapp {
            background: #00e676;
            color: #000;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="menu-container">
    <h2>Le Papa Martin</h2>
    
    <div id="menu-items"></div>

    <div class="form-section">
        <div class="form-group">
            <label>Ваше имя:</label>
            <input type="text" id="client-name" placeholder="Введите имя">
        </div>
        <div class="form-group">
            <label>Способ получения:</label>
            <select id="delivery-type">
                <option value="pickup">Самовывоз (Бесплатно)</option>
                <option value="delivery">Доставка (150 сом / От 1500 бесплатно)</option>
            </select>
        </div>
        <div class="form-group" id="address-block" style="display: none;">
            <label>Адрес доставки:</label>
            <input type="text" id="client-address" placeholder="Улица, дом, квартира">
        </div>
    </div>

    <div class="info-box">
        <div class="account-num">500043714</div>
        <div class="requisites">
            <p><strong>📌 Реквизиты для оплаты:</strong></p>
            <p>Кошелек администратора: +996 773 881 764 (MBank, О!Деньги)</p>
        </div>
    </div>

    <div class="total-box">
        Итого к оплате: <span id="total-price">0</span> сом
    </div>

    <a id="whatsapp-link" class="btn-whatsapp" href="#" onclick="sendOrder(event)">Оформить и отправить в WhatsApp</a>
</div>

<script>
    const adminPhoneNumber = "996773881764";

    const menu = {
        "1": { name: "Искандер Кебаб", price: 440, qty: 0, img: "https://unsplash.com" },
        "2": { name: "Фирменный РD", price: 350, qty: 0, img: "https://ibb.co" },
        "3": { name: "Шаурма по-турецки", price: 350, qty: 0, img: "https://unsplash.com" },
        "4": { name: "Настоящий Донер", price: 350, qty: 0, img: "https://unsplash.com" }
    };

    function renderMenu() {
        const container = document.getElementById('menu-items');
        if (!container) return;
        container.innerHTML = '';
        Object.keys(menu).forEach(id => {
            const item = menu[id];
            const itemDiv = document.createElement('div');
            itemDiv.className = 'menu-item';
            itemDiv.innerHTML = '<div class="item-left"><img class="item-img" src="' + item.img + '"><div class="item-info"><div class="name">' + item.name + '</div><div class="price">' + item.price + ' сом</div></div></div><div class="controls"><button class="btn-qty" onclick="modifyQty(\'' + id + '\', -1)">-</button><span class="qty" id="qty-' + id + '">' + item.qty + '</span><button class="btn-qty" onclick="modifyQty(\'' + id + '\', 1)">+</button></div>';
            container.appendChild(itemDiv);
        });
    }

    function modifyQty(id, change) {
        if (menu[id]) {
            menu[id].qty += change;
            if (menu[id].qty < 0) menu[id].qty = 0;
            document.getElementById('qty-' + id).innerText = menu[id].qty;
            calculateTotal();
        }
    }

    function calculateTotal() {
        let itemsTotal = 0;
        Object.keys(menu).forEach(id => {
            itemsTotal += menu[id].qty * menu[id].price;
        });
        const deliveryType = document.getElementById('delivery-type').value;
        const addressBlock = document.getElementById('address-block');
        let deliveryFee = 0;
        if (deliveryType === 'delivery') {
            addressBlock.style.display = 'block';
            if (itemsTotal > 0) {
                deliveryFee = itemsTotal >= 1500 ? 0 : 150;
            }
        } else {
            addressBlock.style.display = 'none';
        }
        const finalTotal = itemsTotal + deliveryFee;
        document.getElementById('total-price').innerText = finalTotal;
        return { itemsTotal, deliveryFee, finalTotal };
    }

    function sendOrder(event) {
        const data = calculateTotal();
        const deliveryType = document.getElementById('delivery-type').value;
        const clientName = document.getElementById('client-name').value.trim();
        const clientAddress = document.getElementById('client-address').value.trim();

        if (data.itemsTotal === 0) {
            event.preventDefault();
            alert('Пожалуйста, выберите хотя бы одно блюдо!');
            return;
        }
        if (deliveryType === 'delivery' && !clientAddress) {
            event.preventDefault();
            alert('Пожалуйста, укажите адрес доставки!');
            return;
        }

        let message = "*Новый заказ в Le Papa Martin*\n\n";
        if (clientName) message += "👤 *Клиент:* " + clientName + "\n\n";
        message += "📦 *Состав заказа:*\n";
        Object.keys(menu).forEach(id => {
            const item = menu[id];
            if (item.qty > 0) {
                message += "▪️ " + item.name + " x" + item.qty + " (" + (item.qty * item.price) + " сом)\n";
            }
        });
        message += "\n🏪 *Способ:* " + (deliveryType === 'delivery' ? 'Доставка' : 'Самовывоз');
        if (deliveryType === 'delivery') {
            message += "\n📍 *Адрес:* " + clientAddress;
            message += "\n🚚 *Доставка:* " + (data.deliveryFee === 0 ? 'Бесплатно' : data.deliveryFee + ' сом');
        }
        message += "\n\n💰 *ИТОГО К ОПЛАТЕ:* " + data.finalTotal + " сом\n\nПожалуйста, подтвердите заказ.";

        const encodedMessage = encodeURIComponent(message);
        const linkElement = document.getElementById('whatsapp-link');
        linkElement.href = "whatsapp://send?phone=" + adminPhoneNumber + "&text=" + encodedMessage;
    }

    document.addEventListener("DOMContentLoaded", function() {
        renderMenu();
        const delType = document.getElementById('delivery-type');
        if(delType) {
            delType.addEventListener('change', calculateTotal);
        }
    });
    
    setTimeout(renderMenu, 300);
</script>

</body>
</html>
