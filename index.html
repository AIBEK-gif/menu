<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Papa Martin</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .menu-container {
            max-width: 450px;
            width: 100%;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #ff9800;
            margin-top: 5px;
            margin-bottom: 20px;
            font-size: 26px;
            letter-spacing: 1px;
        }
        /* Крупные вертикальные карточки товаров */
        .menu-item {
            background: #2a2a2a;
            margin-bottom: 20px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        /* Фотография теперь занимает верхнюю половину блока */
        .item-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #3b3b3b;
            border-bottom: 2px solid #ff9800;
        }
        /* Блок с текстом и кнопками под фото */
        .item-details {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .item-title {
            font-weight: bold;
            font-size: 19px;
            color: #fff;
            margin: 0;
        }
        /* Нижняя строка: цена слева, управление справа */
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }
        .item-price {
            color: #ffb74d;
            font-size: 18px;
            font-weight: 700;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .btn-qty {
            background: #ff9800;
            color: #000;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-qty:active {
            transform: scale(0.95);
        }
        .qty {
            font-size: 18px;
            font-weight: bold;
            min-width: 24px;
            text-align: center;
            color: #fff;
        }
        .form-section {
            margin: 25px 0 15px 0;
            border-top: 1px dashed #444;
            padding-top: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #b3b3b3;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #ff9800;
            outline: none;
        }
        .info-box {
            background: #2a2a2a;
            padding: 14px;
            border-radius: 10px;
            border-left: 4px solid #ff9800;
            margin-bottom: 20px;
            font-size: 13px;
            color: #ccc;
            line-height: 1.4;
        }
        .account-num {
            background: #121212;
            padding: 4px 8px;
            display: inline-block;
            border-radius: 4px;
            margin-bottom: 8px;
            color: #ff9800;
            font-family: monospace;
            font-weight: bold;
        }
        .total-box {
            text-align: right;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffb74d;
            border-bottom: 1px solid #444;
            padding-bottom: 12px;
        }
        .btn-whatsapp {
            background: #00e676;
            color: #000;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(0,230,118,0.2);
            transition: background 0.2s;
        }
        .btn-whatsapp:hover {
            background: #00c853;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="menu-container">
    <h2>🍔 Le Papa Martin 🌯</h2>
    
    <!-- Сюда скрипт выведет крупные карточки с фото на пол-экрана -->
    <div id="menu-items"></div>

    <div class="form-section">
        <div class="form-group">
            <label>Ваше имя:</label>
            <input type="text" id="client-name" placeholder="Введите ваше имя">
        </div>
        <div class="form-group">
            <label>Способ получения:</label>
            <select id="delivery-type">
                <option value="pickup">Самовывоз (Бесплатно)</option>
                <option value="delivery">Доставка (150 сом / От 1500 бесплатно)</option>
            </select>
        </div>
        <div class="form-group" id="address-block" style="display: none;">
            <label>Адрес доставки:</label>
            <input type="text" id="client-address" placeholder="Улица, дом, квартира">
        </div>
    </div>

    <div class="info-box">
        <div class="account-num">500043714</div>
        <div class="requisites">
            <p style="margin:0 0 5px 0;"><strong>📌 Реквизиты для оплаты:</strong></p>
            <p style="margin:0;">Кошелек администратора: +996 773 881 764 (MBank, О!Деньги)</p>
        </div>
    </div>

    <div class="total-box">
        Итого к оплате: <span id="total-price">0</span> сом
    </div>

    <a id="whatsapp-link" class="btn-whatsapp" href="#" onclick="sendOrder(event)">Оформить и отправить в WhatsApp</a>
</div>

<script>
    const adminPhoneNumber = "996773881764";

    // Меню с проверенными и крупными фотографиями
    const menu = {
        "1": { name: "Искандер Кебаб", price: 440, qty: 0, img: "https://unsplash.com" },
        "2": { name: "Фирменный РD", price: 350, qty: 0, img: "https://unsplash.com" },
        "3": { name: "Шаурма по-турецки", price: 350, qty: 0, img: "https://unsplash.com" },
        "4": { name: "Настоящий Донер", price: 350, qty: 0, img: "https://unsplash.com" }
    };

    function renderMenu() {
        const container = document.getElementById('menu-items');
        if (!container) return;
        container.innerHTML = '';
        
        Object.keys(menu).forEach(id => {
            const item = menu[id];
            const itemDiv = document.createElement('div');
            itemDiv.className = 'menu-item';
            
            // Новая структура: крупное фото сверху, детали и кнопки под ним
            itemDiv.innerHTML = `
                <img class="item-img" src="${item.img}" alt="${item.name}">
                <div class="item-details">
                    <div class="item-title">${item.name}</div>
                    <div class="item-row">
                        <div class="item-price">${item.price} сом</div>
                        <div class="controls">
                            <button class="btn-qty" onclick="modifyQty('${id}', -1)">-</button>
                            <span class="qty" id="qty-${id}">${item.qty}</span>
                            <button class="btn-qty" onclick="modifyQty('${id}', 1)">+</button>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(itemDiv);
        });
    }

    function modifyQty(id, change) {
        if (menu[id]) {
            menu[id].qty += change;
            if (menu[id].qty < 0) menu[id].qty = 0;
            document.getElementById('qty-' + id).innerText = menu[id].qty;
            calculateTotal();
        }
    }

    function calculateTotal() {
        let itemsTotal = 0;
        Object.keys(menu).forEach(id => {
            itemsTotal += menu[id].qty * menu[id].price;
        });
        
        const deliveryType = document.getElementById('delivery-type').value;
        const addressBlock = document.getElementById('address-block');
        let deliveryFee = 0;
        
        if (deliveryType === 'delivery') {
            addressBlock.style.display = 'block';
            if (itemsTotal > 0) {
                deliveryFee = itemsTotal >= 1500 ? 0 : 150;
            }
        } else {
            addressBlock.style.display = 'none';
        }
        
        const finalTotal = itemsTotal + deliveryFee;
        document.getElementById('total-price').innerText = finalTotal;
        return { itemsTotal, deliveryFee, finalTotal };
    }

    function sendOrder(event) {
        const data = calculateTotal();
