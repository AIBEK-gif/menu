<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Papa Martin</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .menu-container {
            max-width: 450px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #ff9800;
            margin-top: 0;
        }
        .menu-item {
            background: #2a2a2a;
            margin-bottom: 15px;
            border-radius: 12px;
            padding: 15px;
        }
        .item-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-price {
            color: #ffb74d;
            font-size: 16px;
            font-weight: bold;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-qty {
            background: #ff9800;
            color: #000;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .qty {
            font-size: 16px;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }
        .form-section {
            margin: 20px 0;
            border-top: 1px dashed #444;
            padding-top: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #b3b3b3;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .info-box {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #ff9800;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .account-num {
            background: #121212;
            padding: 4px 8px;
            display: inline-block;
            border-radius: 4px;
            margin-bottom: 5px;
            color: #ff9800;
        }
        .total-box {
            text-align: right;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffb74d;
        }
        .btn-whatsapp {
            background: #00e676;
            color: #000;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="menu-container">
    <h2>Le Papa Martin</h2>
    
    <div id="menu-items">
        <div class="menu-item">
            <div class="item-title">Искандер Кебаб</div>
            <div class="item-row">
                <div class="item-price">440 сом</div>
                <div class="controls">
                    <button class="btn-qty" onclick="changeCount('kebab',-1)">-</button>
                    <span class="qty" id="qty-kebab">0</span>
                    <button class="btn-qty" onclick="changeCount('kebab',1)">+</button>
                </div>
            </div>
        </div>

        <div class="menu-item">
            <div class="item-title">Фирменный РD</div>
            <div class="item-row">
                <div class="item-price">350 сом</div>
                <div class="controls">
                    <button class="btn-qty" onclick="changeCount('burger',-1)">-</button>
                    <span class="qty" id="qty-burger">0</span>
                    <button class="btn-qty" onclick="changeCount('burger',1)">+</button>
                </div>
            </div>
        </div>

        <div class="menu-item">
            <div class="item-title">Шаурма по-турецки</div>
            <div class="item-row">
                <div class="item-price">350 сом</div>
                <div class="controls">
                    <button class="btn-qty" onclick="changeCount('shawa',-1)">-</button>
                    <span class="qty" id="qty-shawa">0</span>
                    <button class="btn-qty" onclick="changeCount('shawa',1)">+</button>
                </div>
            </div>
        </div>

        <div class="menu-item">
            <div class="item-title">Настоящий Донер</div>
            <div class="item-row">
                <div class="item-price">350 сом</div>
                <div class="controls">
                    <button class="btn-qty" onclick="changeCount('doner',-1)">-</button>
                    <span class="qty" id="qty-doner">0</span>
                    <button class="btn-qty" onclick="changeCount('doner',1)">+</button>
                </div>
            </div>
        </div>
    </div>

    <div class="form-section">
        <div class="form-group">
            <label>Ваше имя:</label>
            <input type="text" id="client-name" placeholder="Введите имя">
        </div>
        <div class="form-group">
            <label>Способ получения:</label>
            <select id="delivery-type" onchange="updateDelivery()">
                <option value="pickup">Самовывоз (Бесплатно)</option>
                <option value="delivery">Доставка (150 сом / От 1500 бесплатно)</option>
            </select>
        </div>
        <div class="form-group" id="address-block" style="display: none;">
            <label>Адрес доставки:</label>
            <input type="text" id="client-address" placeholder="Улица, дом, квартира">
        </div>
    </div>

    <div class="info-box">
        <div class="account-num">500043714</div>
        <div class="requisites">
            <p><strong>📌 Реквизиты для оплаты:</strong></p>
            <p>Кошелек администратора: +996 773 881 764 (MBank, О!Деньги)</p>
        </div>
    </div>

    <div class="total-box">
        Итого к оплате: <span id="total-price">0</span> сом
    </div>

    <a id="whatsapp-link" class="btn-whatsapp" href="#" onclick="sendOrder(event)">Оформить и отправить в WhatsApp</a>
</div>

<script>
    const orderData = { kebab: 0, burger: 0, shawa: 0, doner: 0 };
    const prices = { kebab: 440, burger: 350, shawa: 350, doner: 350 };
    const names = { kebab: "Искандер Кебаб", burger: "Фирменный РD", shawa: "Шаурма по-турецки", doner: "Настоящий Донер" };

    function changeCount(id, delta) {
        orderData[id] += delta;
        if (orderData[id] < 0) orderData[id] = 0;
        document.getElementById("qty-" + id).innerText = orderData[id];
        updateTotalBox();
    }

    function updateDelivery() {
        const type = document.getElementById("delivery-type").value;
        document.getElementById("address-block").style.display = (type === "delivery") ? "block" : "none";
        updateTotalBox();
    }

    function updateTotalBox() {
        let itemsSum = 0;
        Object.keys(orderData).forEach(id => { itemsSum += orderData[id] * prices[id]; });
        
        let deliveryFee = 0;
        const type = document.getElementById("delivery-type").value;
        if (type === "delivery" && itemsSum > 0) {
            deliveryFee = (itemsSum >= 1500) ? 0 : 150;
        }
        
        document.getElementById("total-price").innerText = itemsSum + deliveryFee;
        return { itemsSum, deliveryFee, finalSum: itemsSum + deliveryFee };
    }

    function sendOrder(event) {
        const sums = updateTotalBox();
        const type = document.getElementById("delivery-type").value;
        const nameInput = document.getElementById("client-name").value.trim();
        const addressInput = document.getElementById("client-address").value.trim();

        if (sums.itemsSum === 0) {
            event.preventDefault();
            alert("Пожалуйста, выберите блюда!");
            return;
        }
        if (type === "delivery" && !addressInput) {
            event.preventDefault();
            alert("Пожалуйста, укажите адрес доставки!");
            return;
        }

        let txt = "*Новый заказ в Le Papa Martin*\n\n";
        if (nameInput) txt += "👤 *Клиент:* " + nameInput + "\n\n";
        
        txt += "📦 *Состав заказа:*\n";
        Object.keys(orderData).forEach(id => {
            if (orderData[id] > 0) {
                txt += "▪️ " + names[id] + " x" + orderData[id] + " (" + (orderData[id] * prices[id]) + " сом)\n";
            }
        });
        
        txt += "\n🏪 *Способ:* " + (type === "delivery" ? "Доставка" : "Самовывоз");
        if (type === "delivery") {
            txt += "\n📍 *Адрес:* " + addressInput;
            txt += "\n🚚 *Доставка:* " + (sums.deliveryFee === 0 ? "Бесплатно" : sums.deliveryFee + " сом");
        }
        txt += "\n\n💰 *ИТОГО К ОПЛАТЕ:* " + sums.finalSum + " сом\n\nПожалуйста, подтвердите заказ.";

        const link = document.getElementById("whatsapp-link");
        link.href = "whatsapp://send?phone=996773881764&text=" + encodeURIComponent(txt);
    }
</script>

</body>
</html>
